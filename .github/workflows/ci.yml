name: Monaco CI

on:
  push:
    branches: [ kilo/fancy-bit-ku9, main ]
  pull_request:
    branches: [ kilo/fancy-bit-ku9, main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint and format check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: "stable"

      - name: Generate Android scaffold
        run: |
          cd /tmp
          flutter create --project-name=monaco --platforms=android temp_monaco
          cp -r temp_monaco/android client/
          cp temp_monaco/.dart_tool client/.dart_tool 2>/dev/null || true
          cp temp_monaco/.gitignore client/.gitignore 2>/dev/null || true
          rm -rf temp_monaco

      - name: Persist Android scaffold
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add client/android/
          git commit -m "Android scaffold: add Flutter Android Gradle project"

      - name: Install Flutter dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Dart analyze
        working-directory: ./client
        run: flutter analyze

  test:
    runs-on: ubuntu-latest
    name: Run unit and integration tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monaco
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -d postgresql://postgres:postgres@localhost:5432/monaco"
          --health-interval 10s
          --health-timeout 5s
          --health-retries: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for PostgreSQL
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monaco
        run: |
          for i in $(seq 1 30); do
            pg_isready -d "$DATABASE_URL" && exit 0
            sleep 2
          done
          echo "PostgreSQL did not become ready" && exit 1

      - name: Run database migrations (fail-fast) and verify schema
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monaco
          JWT_SECRET: ci-test-secret
        run: npm run migrate

      - name: Run backend integration tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/monaco
          JWT_SECRET: ci-test-secret
        run: npm ci && npm test

      - name: Verify .gitignore excludes secrets
        run: |
          if grep -q '\.env' .gitignore; then
            echo "PASS: .gitignore excludes .env files"
          else
            echo "FAIL: .gitignore does not exclude .env files"
            exit 1
          fi
          if grep -q 'node_modules' .gitignore; then
            echo "PASS: .gitignore excludes node_modules"
          else
            echo "FAIL: .gitignore does not exclude node_modules"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    name: Build Android debug APK
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: "stable"

      - name: Install Flutter dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Build debug APK
        working-directory: ./client
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: monaco-debug-apk
          path: ./client/build/app/outputs/flutter-apk/app-debug.apk
